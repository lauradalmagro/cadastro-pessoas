<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas</title>
    <link rel="icon" type="image/png" href="./images.png">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Cadastro de Pessoas</h1>
    </header>

    <main>
        <h2>Cadastre-se!</h2>

        <form id="form-pessoa">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" placeholder="Digite sua idade" required>

            <label for="profissao">Profissão:</label>
            <input type="text" id="profissao" placeholder="Digite sua profissão" required>

            <button type="submit" id="botao">Cadastrar</button>
        </form>

        <h2>Pessoas cadastradas</h2>
        <div id="lista-pessoas"></div>
    </main>

    <script type="module" src="./main.js"></script>
</body>
</html>
